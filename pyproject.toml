[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "numerical-dynamics"
version = "1.0.0"
description = "Reproducible numerical stability and error analysis for classical and quantum dynamical systems"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Project contributors"}]
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]
notebook = ["jupyter>=1", "nbformat>=5"]

[project.scripts]
numerical-dynamics = "numerical_dynamics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
